[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cucorr"
version = "0.1.0"
description = "Expert-in-the-loop semantic segmentation and annotation of copper corrosion products"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "openpyxl>=3.1", "pillow>=10",
  "scikit-image>=0.22", "scikit-learn>=1.3", "pyyaml>=6",
]

[project.optional-dependencies]
deep = ["torch>=2.2", "segmentation-models-pytorch>=0.3"]
sam = ["torch>=2.2", "sam2"]
app = ["streamlit>=1.30", "streamlit-drawable-canvas>=0.9"]
xai = ["shap>=0.44"]
dev = ["pytest>=7"]

[project.scripts]
cucorr = "cucorr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
